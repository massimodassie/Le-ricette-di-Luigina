<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Le ricette di Luigina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Font per lo stile manuscritto e UI moderna -->
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Inter:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Tonalità calde e scure per il tema legno/farina */
      --bg-main: #24211e; /* Colore di fallback scuro */
      --overlay-bg: rgba(36, 33, 30, 0.86); /* Velatura scura semi-trasparente */
      --surface-card: rgba(251, 248, 242, 0.94); /* Card dell'archivio leggermente trasparenti */
      --text-dark: #24211e;
      --text-light: #fbf8f2;
      --muted: #a8a29e;
      --accent: #b8292f; /* Rosso per azioni principali */
      --accent-hover: #941e23;
      --border-subtle: rgba(251, 248, 242, 0.3);

      --font-script: "Alex Brush", Georgia, cursive;
      --font-hand: "Patrick Hand", Georgia, serif;
      --font-ui: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;

      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 9px;
      --shadow-deep: 0 14px 36px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-ui);
      color: var(--text-light);
      line-height: 1.6;
      min-height: 100vh;
      /* Immagine di sfondo */
      background: var(--bg-main) url('sfondo-cucina.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
    }

    /* LAYER DI VELATURA Sopra lo sfondo */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--overlay-bg);
      z-index: -1;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 32px;
      align-items: start;
      padding: 40px;
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding-right: 24px;
      border-right: 1px solid var(--border-subtle);
    }

    .brand-box h1 {
      font-family: var(--font-script);
      font-size: 52px;
      font-weight: 400;
      margin: 0 0 12px 0;
      line-height: 1.0;
      color: var(--text-light);
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .user-meta {
      font-size: 14px;
      color: var(--muted);
    }
    .user-meta .badge {
      background: var(--accent);
      color: white;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 6px;
    }

    .nav-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .nav-link {
      background: none;
      border: none;
      color: var(--muted);
      text-align: left;
      padding: 10px 0;
      font-weight: 500;
      font-size: 18px;
      cursor: pointer;
      transition: color 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-link:hover {
      color: var(--text-light);
    }
    .nav-link.active {
      color: var(--text-light);
      font-weight: 700;
      border-right: 2px solid var(--accent);
      padding-right: 6px;
    }
    .nav-link .badge {
       background: rgba(251, 248, 242, 0.12);
       padding: 2px 8px;
       border-radius: 99px;
       font-size: 13px;
    }
    .nav-link.active .badge {
      background: var(--accent);
    }

    .logout-btn {
      margin-top: auto;
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--muted);
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      width: fit-content;
    }
    .logout-btn:hover {
      border-color: var(--text-light);
      color: var(--text-light);
    }

    .main-content {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .top-bar {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: flex-end;
    }

    input, select {
      background: rgba(251, 248, 242, 0.95);
      border: none;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-family: var(--font-ui);
      font-size: 15px;
      color: var(--text-dark);
    }
    input:focus, select:focus {
      outline: 2px solid var(--accent);
    }
    .search-bar { flex: 2; }
    .cat-filter { flex: 1; max-width: 200px;}

    .archive-header h2 {
      font-size: 32px;
      margin: 0 0 8px 0;
      color: var(--text-light);
      font-weight: 400;
    }
    .archive-header p {
      color: var(--muted);
      margin: 0;
      font-size: 16px;
    }

    .recipes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    /* CARDS RICETTE (Sostituite con versione minimal) */
    .recipe-card {
      background: var(--surface-card);
      border-radius: var(--radius-md);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }
    .recipe-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-deep);
    }
    .card-title {
      font-family: var(--font-script);
      font-size: 42px;
      color: var(--text-dark);
      margin: 0;
      line-height: 1.0;
    }
    .card-meta {
      font-size: 14px;
      color: #655e55;
      margin-bottom: 6px;
    }
    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto; /* Spinge i bottoni in basso */
      padding-top: 10px;
    }

    .btn-action {
      font-family: var(--font-ui);
      font-size: 13px;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      border: none;
      font-weight: 600;
      transition: background 0.15s;
    }

    .btn-primary { /* "Apri" */
       background: var(--accent);
       color: white;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-secondary { /* "Modifica" */
      background: rgba(36, 33, 30, 0.08);
      color: var(--text-dark);
    }
    .btn-secondary:hover { background: rgba(36, 33, 30, 0.15); }

    .btn-danger { /* "Elimina" */
      background: transparent;
      color: var(--accent);
      margin-left: auto; /* Sposta elimina a destra */
    }
    .btn-danger:hover { color: var(--accent-hover); background: rgba(184, 41, 47, 0.1); }

    /* MODALE DETTAGLIO (Stile foglio di carta) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(36, 33, 30, 0.9);
      display: none;
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 40px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .modal-overlay.open {
      display: flex;
      opacity: 1;
    }
    .modal-content {
      background: #fbf8f2;
      color: var(--text-dark);
      width: 100%;
      max-width: 750px;
      max-height: 90vh;
      border-radius: var(--radius-lg);
      padding: 40px;
      overflow-y: auto;
      /* Effetto foglio a righe */
      background-image: repeating-linear-gradient(#fbf8f2 0px, #fbf8f2 31px, rgba(122, 148, 173, 0.15) 32px);
      line-height: 32px; /* Allineato alle righe */
      box-shadow: var(--shadow-deep);
      transform: scale(0.95);
      transition: transform 0.3s;
    }
    .modal-overlay.open .modal-content {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 20px;
    }
    .modal-title {
      font-family: var(--font-script);
      font-size: 64px;
      margin: 0;
      line-height: 0.9;
      color: var(--text-dark);
    }
    .close-modal {
      background: transparent;
      border: none;
      font-size: 32px;
      cursor: pointer;
      color: var(--muted);
      line-height: 1.0;
    }
    .close-modal:hover { color: var(--accent); }

    .section-title {
      font-family: var(--font-hand);
      font-size: 28px;
      color: #8f3622;
      font-weight: 700;
      margin: 24px 0 8px 0;
      border-bottom: 2px solid #e6bfb4;
      display: inline-block;
      padding-bottom: 2px;
      line-height: 1.2;
    }
    .modal-text {
      font-family: var(--font-hand);
      font-size: 24px;
      white-space: pre-wrap;
      margin: 0;
    }

    /* SCHERMATA LOGIN */
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px;
    }
    .login-box {
      background: var(--overlay-bg);
      backdrop-filter: blur(10px);
      padding: 48px;
      border-radius: var(--radius-lg);
      text-align: center;
      width: 100%;
      max-width: 420px;
      border: 1px solid var(--border-subtle);
    }
    .login-box h1 {
      font-family: var(--font-script);
      font-size: 64px;
      margin: 0 0 16px 0;
      color: var(--text-light);
    }
    .login-box p {
      color: var(--muted);
      margin-bottom: 32px;
    }
    .login-input {
       width: 100%;
       margin-bottom: 16px;
    }
    .btn-login {
       width: 100%;
       margin-top: 16px;
       background: var(--accent);
       color: white;
       padding: 12px;
       font-size: 16px;
    }
    .btn-login:hover { background: var(--accent-hover); }

    .hidden { display: none !important; }

    /* Media Queries per schermi piccoli (mobile) */
    @media (max-width: 900px) {
      .app-shell {
        grid-template-columns: 1fr;
        padding: 20px;
        gap: 20px;
      }
      .sidebar {
        position: static;
        border-right: none;
        padding-right: 0;
        border-bottom: 1px solid var(--border-subtle);
        padding-bottom: 20px;
      }
      .brand-box h1 { font-size: 42px; }
      .nav-link { font-size: 16px; padding: 8px 0;}
      .modal-content { padding: 20px; line-height: 28px;}
      .modal-title { font-size: 48px; }
      .section-title { font-size: 24px; }
      .modal-text { font-size: 20px; }
      .card-title { font-size: 36px; }
    }
  </style>
</head>
<body>

  <!-- SCHERMATA DI LOGIN -->
  <div id="login-section" class="login-container hidden">
    <div class="login-box">
      <h1>Le ricette di Luigina</h1>
      <p>Accedi per consultare l'archivio di famiglia.</p>
      <input type="email" id="email-input" class="login-input" placeholder="Email" />
      <input type="password" id="pass-input" class="login-input" placeholder="Password" />
      <button id="login-btn" class="btn-action btn-login">Accedi</button>
      <p id="login-error" class="hidden" style="color: var(--accent); font-size: 14px; margin-top: 16px;"></p>
    </div>
  </div>

  <!-- APP PRINCIPALE -->
  <div id="app-shell" class="app-shell hidden">

    <!-- MENU LATERALE (Sostituito con testo pulito) -->
    <aside class="sidebar">
      <div class="brand-box">
        <h1>Le ricette di Luigina</h1>
        <div class="user-meta">
          <span id="user-display"></span>
          <span id="user-role-badge" class="badge hidden"></span>
        </div>
      </div>

      <nav class="nav-group" aria-label="Menu principale">
        <button class="nav-link active">Archivio ricette <span id="recipe-count-badge" class="badge">0</span></button>
        <button class="nav-link + Nuova Ricetta (presto)">+ Nuova Ricetta <span class="badge">Aggiungi</span></button>
         <button class="nav-link Setup (presto)">Setup (Impostazioni) <span class="badge">⚙️</span></button>
      </nav>
      <button id="logout-btn" class="logout-btn">Esci</button>
    </aside>

    <!-- AREA PRINCIPALE -->
    <main class="main-content">
      <!-- Barra di ricerca e filtri -->
      <div class="top-bar">
        <input type="search" id="search-input" class="search-bar" placeholder="Cerca per titolo, ingrediente o origine..." />
        <select id="category-filter" class="cat-filter">
          <option value="ALL">Tutte le categorie</option>
          <option value="Antipasti">Antipasti</option>
          <option value="Primi">Primi</option>
          <option value="Secondi">Secondi</option>
          <option value="Contorni">Contorni</option>
          <option value="Lievitati">Lievitati</option>
          <option value="Dolci">Dolci</option>
          <option value="Conserve">Conserve</option>
          <option value="Altro">Altro</option>
        </select>
      </div>

      <!-- Header Archivio -->
      <div class="archive-header">
        <h2>Ricette in archivio</h2>
        <p id="archive-subtitle">Consultazione dell'archivio digitale</p>
      </div>

      <!-- GRIGLIA RICETTE (Sostituita con versione minimal) -->
      <div id="recipes-grid" class="recipes-grid">
        <!-- ESEMPI VISIVI CARICATI DAL RENDER (questi sono statici per il render, il codice vero li caricherà da Firebase) -->

        <!-- Card 1: Cantucci -->
        <article class="recipe-card">
           <h3 class="card-title">Cantucci</h3>
           <p class="card-meta">Dolci • Scritto a mano</p>
           <div class="card-actions">
             <button class="btn-action btn-primary open-modal" data-recipe="cantucci">Apri</button>
             <button class="btn-action btn-secondary edit-recipe">Modifica</button>
             <button class="btn-action btn-danger delete-recipe">Elimina</button>
           </div>
        </article>

        <!-- Card 2: Barchette a Vela -->
        <article class="recipe-card">
           <h3 class="card-title">Barchette a Vela</h3>
           <p class="card-meta">Antipasti • Ritaglio stampato</p>
           <div class="card-actions">
             <button class="btn-action btn-primary open-modal" data-recipe="barchette">Apri</button>
             <button class="btn-action btn-secondary edit-recipe">Modifica</button>
             <button class="btn-action btn-danger delete-recipe">Elimina</button>
           </div>
        </article>

      </div>
    </main>
  </div>

  <!-- MODALE DETTAGLIO (Stile foglio a righe) -->
  <div id="modal-overlay" class="modal-overlay">
     <div id="modal-content" class="modal-content">
       <header class="modal-header">
         <h1 id="modal-title" class="modal-title">Titolo</h1>
         <button id="close-modal" class="close-modal">&times;</button>
       </header>
       <p id="modal-meta" class="card-meta" style="border-bottom: 1px solid var(--border-subtle); padding-bottom: 8px;"></p>

       <div class="section-title">Ingredienti</div>
       <p id="modal-ingredients" class="modal-text"></p>

       <div class="section-title">Procedimento</div>
       <p id="modal-steps" class="modal-text"></p>

       <div class="section-title" style="color: var(--muted); border-color: var(--muted);">Note</div>
       <p id="modal-origin" class="modal-text" style="font-size: 16px; color: var(--muted);"></p>
     </div>
  </div>

  <!-- Firebase SDKs (NECESSARI PER FAR FUNZIONARE IL CODICE) -->
  <!-- Sostituisci questi script con quelli del tuo progetto Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script>
    // --- CONFIGURAZIONE FIREBASE (Sostituisci con i tuoi dati) ---
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Inizializza Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Dati di esempio per il render (da sostituire con dati reali dal DB)
    const recipeData = {
        'cantucci': {
            title: 'Cantucci',
            category: 'Dolci',
            origin: 'Scritto a mano (Foglio 1)',
            ingredients: '500 g farina\n300 g zucchero\n100 g burro o strutto\n3 uova intere\n1 bustina di lievito per dolci\n300 g mandorle con la pelle',
            steps: '1. In una ciotola capiente, sbattere le uova con lo zucchero fino a renderle spumose.\n2. Aggiungere il burro morbido (o lo strutto) e amalgamare bene.\n3. Incorporare la farina setacciata insieme al lievito per dolci, lavorando l'impasto fino a renderlo omogeneo.\n4. Aggiungere le mandorle intere con la pelle e distribuirle uniformemente nell'impasto.\n5. Formare con le mani dei filoncini larghi circa 2-3 cm e disporli su una teglia rivestita di carta da forno, tenendoli distanziati.\n6. Cuocere in forno preriscaldato a 180° per circa 10 minuti.\n7. Sfornare i filoncini, lasciarli intiepidire qualche minuto e tagliarli in diagonale a fette di circa 1,5 cm di spessore.\n8. Rimettere i biscotti in teglia distesi e tostarli in forno per altri 5-8 minuti fino a doratura uniforme.'
        },
        'barchette': {
            title: 'Barchette a Vela',
            category: 'Antipasti',
            origin: 'Ritaglio stampato/Bimby',
            ingredients: 'Pasta sfoglia (2 rotoli)\nProsciutto cotto (200g)\nFormaggio spalmabile (Philadelphia 250g)\nGrana padano (50g)\nUovo (1 per spennellare)',
            steps: '1. Stendere la pasta sfoglia e ricavare dei cerchi con un coppapasta.\n2. Preparare il ripieno mescolando il formaggio spalmabile, il prosciutto cotto tritato e il Grana padano.\n3. Mettere un cucchiaio di ripieno al centro di ogni cerchio di sfoglia.\n4. Chiudere la sfoglia a metà, formando una mezzaluna, e sigillare bene i bordi con i rebbi di una forchetta.\n5. Pizzicare l'estremità della mezzaluna verso il centro per creare la forma di "barchetta".\n6. Spennellare con l\'uovo sbattuto.\n7. Cuocere in forno caldo a 190°C per circa 15 minuti, fino a doratura.'
        }
    };

    // --- LOGICA DI AUTENTICAZIONE ---
    const loginSection = document.getElementById('login-section');
    const appShell = document.getElementById('app-shell');
    const emailInput = document.getElementById('email-input');
    const passInput = document.getElementById('pass-input');
    const loginBtn = document.getElementById('login-btn');
    const loginError = document.getElementById('login-error');
    const userDisplay = document.getElementById('user-display');
    const userRoleBadge = document.getElementById('user-role-badge');
    const logoutBtn = document.getElementById('logout-btn');

    // Gestione stato autenticazione
    auth.onAuthStateChanged(user => {
      if (user) {
        // Utente loggato
        loginSection.classList.add('hidden');
        appShell.classList.remove('hidden');
        userDisplay.textContent = user.email;
        // Recupera il ruolo da Firestore (opzionale, se hai una collezione 'users')
        db.collection('users').doc(user.uid).get().then(doc => {
           if(doc.exists && doc.data().role) {
               userRoleBadge.textContent = doc.data().role.toUpperCase();
               userRoleBadge.classList.remove('hidden');
           }
        }).catch(e => console.log("Ruolo non trovato", e));

      } else {
        // Utente non loggato
        loginSection.classList.remove('hidden');
        appShell.classList.add('hidden');
      }
    });

    // Login con email e password
    loginBtn.addEventListener('click', () => {
      const email = emailInput.value;
      const pass = passInput.value;
      loginError.classList.add('hidden');

      auth.signInWithEmailAndPassword(email, pass)
        .catch(error => {
          loginError.textContent = 'Errore: ' + error.message;
          loginError.classList.remove('hidden');
        });
    });

    // Logout
    logoutBtn.addEventListener('click', () => {
      auth.signOut();
    });

    // --- LOGICA ARCHIVIO & MODALE ---
    const modalOverlay = document.getElementById('modal-overlay');
    const modalTitle = document.getElementById('modal-title');
    const modalMeta = document.getElementById('modal-meta');
    const modalIngredients = document.getElementById('modal-ingredients');
    const modalSteps = document.getElementById('modal-steps');
    const modalOrigin = document.getElementById('modal-origin');
    const closeModalBtn = document.getElementById('close-modal');
    const searchInput = document.getElementById('search-input');
    const categoryFilter = document.getElementById('category-filter');
    const recipeCountBadge = document.getElementById('recipe-count-badge');

    // --- Connessione a Firestore ---
    // (Questo codice sostituirà gli esempi statici sopra, una volta attivato Firebase)
    function loadRecipes() {
        let query = db.collection('recipes').orderBy('title');
        const category = categoryFilter.value;
        const searchTerm = searchInput.value.toLowerCase();

        // NOTA: Le query complesse (filtro + ricerca) in Firestore richiedono indici specifici.
        // Per questo esempio di render, carichiamo solo tutto e filtriamo lato client per semplicità.
        // In produzione, useresti query filtrate direttamente sul DB.

        db.collection('recipes').get().then(snapshot => {
            const grid = document.getElementById('recipes-grid');
            grid.innerHTML = ''; // Pulisce la griglia di esempio
            let count = 0;

            snapshot.forEach(doc => {
                const r = doc.data();
                // Filtro Categoria
                if (category !== 'ALL' && r.category !== category) return;
                // Filtro Ricerca
                if (searchTerm) {
                    const searchableText = (r.title + " " + r.ingredients + " " + r.origin).toLowerCase();
                    if (!searchableText.includes(searchTerm)) return;
                }

                count++;
                // Crea la card dinamicamente
                const article = document.createElement('article');
                article.className = 'recipe-card';
                article.innerHTML = `
                   <h3 class="card-title">${escapeHtml(r.title)}</h3>
                   <p class="card-meta">${escapeHtml(r.category)} • ${escapeHtml(r.origin)}</p>
                   <div class="card-actions">
                     <button class="btn-action btn-primary open-modal" data-recipe-id="${doc.id}">Apri</button>
                     <button class="btn-action btn-secondary edit-recipe">Modifica</button>
                     <button class="btn-action btn-danger delete-recipe" data-recipe-id="${doc.id}">Elimina</button>
                   </div>
                `;
                grid.appendChild(article);
            });

            recipeCountBadge.textContent = count;

            // Aggiungi gli event listener ai bottoni dinamici
            attachModalListeners();
             // Aggiungi i listener per elimina/modifica (da implementare)
            attachEditDeleteListeners();
        });
    }

    function attachModalListeners() {
         // Apri modale (collegamento ai dati di esempio PER ORA)
        document.querySelectorAll('.open-modal').forEach(btn => {
          btn.addEventListener('click', (e) => {
            // VERSIONE FUTURA CON FIREBASE:
            /*
            const recipeId = e.target.dataset.recipeId;
            db.collection('recipes').doc(recipeId).get().then(doc => {

               // Popola il modale...
            });
            */

            // VERSIONE ATTUALE DI ESEMPIO CON IL RENDER:
            const recipeKey = e.target.dataset.recipe; // Usa l'attributo data-recipe="cantucci" dai bottoni statici sopra
            let r = recipeData[recipeKey];

            // Se è un bottone dinamico senza recipeKey, usa un default per test
            if(!r && e.target.dataset.recipeId) {
                r = { title: "Caricamento...", category: "...", origin: "...", ingredients: "...", steps: "..." };
                 // Qui recupereresti i dati reali via ID come sopra commentato
            }

            if(r) {
                modalTitle.textContent = r.title;
                modalMeta.textContent = `${r.category} • ${r.origin}`;
                modalIngredients.textContent = r.ingredients;
                modalSteps.textContent = r.steps;
                modalOrigin.textContent = r.origin;
                modalOverlay.classList.add('open');
            }
          });
        });
    }

    function attachEditDeleteListeners() {
        // --- TODO: Implementare logica di modifica e cancellazione ---
        document.querySelectorAll('.delete-recipe').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if(confirm("Sei sicuro di voler eliminare questa ricetta?")) {
                    const id = e.target.dataset.recipeId;
                    // db.collection('recipes').doc(id).delete().then(() => loadRecipes());
                }
            })
        })
    }

    // Chiudi modale
    function closeModal() {
      modalOverlay.classList.remove('open');
    }

    closeModalBtn.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Gestione filtri e ricerca
    searchInput.addEventListener('input', loadRecipes);
    categoryFilter.addEventListener('change', loadRecipes);

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Carica le ricette all'avvio (quando l'utente si logga)
